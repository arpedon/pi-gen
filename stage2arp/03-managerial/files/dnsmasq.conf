interface=wlan0
bind-interfaces
dhcp-range=192.168.10.2,192.168.10.20,255.255.255.0,24h
# Default gateway (router) offered to clients
dhcp-option=3,192.168.10.1
# DNS server offered to clients (this dnsmasq instance)
dhcp-option=6,192.168.10.1
# Captive portal: resolve all hostnames to the AP IP
address=/#/192.168.10.1
